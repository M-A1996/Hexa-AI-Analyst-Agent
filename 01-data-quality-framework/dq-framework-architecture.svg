<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Automated Data-Quality Framework — architecture (built at Hazel Mobile)</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888780"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="620" fill="#ffffff"/>
  <style>
    .box  { fill: #f6f5f0; stroke: #888780; stroke-width: 1.5; }
    .in   { fill: #ffffff; stroke: #b4b2a9; stroke-width: 1.2; }
    .t    { fill: #2c2c2a; font-weight: 700; font-size: 14px; }
    .s    { fill: #5f5e5a; font-size: 11px; }
    .m    { fill: #888780; font-size: 10px; }
    .lbl  { fill: #888780; font-size: 10px; font-style: italic; }
    .flow { stroke: #888780; stroke-width: 1.6; fill: none; }
    .acc  { stroke: #1D9E75; }
  </style>

  <!-- SOURCE -->
  <rect class="box" x="235" y="16" width="250" height="54" rx="10"/>
  <text class="t" x="360" y="40" text-anchor="middle">Connection / session telemetry</text>
  <text class="s" x="360" y="58" text-anchor="middle">PostgreSQL · read-only</text>
  <path class="flow" d="M360,70 L360,96" marker-end="url(#ag)"/>

  <!-- DQ ENGINE CONTAINER -->
  <rect class="box acc" x="30" y="98" width="660" height="212" rx="14" stroke-width="2"/>
  <rect x="30" y="98" width="660" height="30" rx="14" fill="#1D9E75"/>
  <rect x="30" y="114" width="660" height="14" fill="#1D9E75"/>
  <text x="360" y="119" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="13.5">Automated Data-Quality Engine (SQL)</text>
  <rect x="188" y="138" width="344" height="22" rx="11" fill="#1D9E75"/>
  <text x="360" y="153" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="600">Read-only · non-destructive (reclassify, never delete)</text>

  <!-- 3 TIERS -->
  <rect class="in" x="45" y="176" width="190" height="118" rx="9"/>
  <text class="t" x="140" y="205" text-anchor="middle" font-size="13">Row-level (#1–#11)</text>
  <text class="s" x="140" y="224" text-anchor="middle">is each record clean?</text>
  <text class="m" x="140" y="246" text-anchor="middle">timestamps · country · IP</text>
  <text class="m" x="140" y="262" text-anchor="middle">duration · self-replace</text>

  <rect class="in" x="250" y="176" width="190" height="118" rx="9"/>
  <text class="t" x="345" y="205" text-anchor="middle" font-size="13">Behavioural (B1–B10)</text>
  <text class="s" x="345" y="224" text-anchor="middle">is each account normal?</text>
  <text class="m" x="345" y="246" text-anchor="middle">churn · bots / burst</text>
  <text class="m" x="345" y="262" text-anchor="middle">one-and-done · hopping</text>

  <rect class="in" x="455" y="176" width="190" height="118" rx="9"/>
  <text class="t" x="550" y="205" text-anchor="middle" font-size="13">Journey (T1–T3)</text>
  <text class="s" x="550" y="224" text-anchor="middle">good, lasting experience?</text>
  <text class="m" x="550" y="246" text-anchor="middle">flap · activation</text>
  <text class="m" x="550" y="262" text-anchor="middle">D1 return · churn-risk</text>

  <!-- reclassify arrow -->
  <path class="flow" d="M360,310 L360,346" marker-end="url(#ag)"/>
  <text class="lbl" x="360" y="330" text-anchor="middle">reclassify success → failure  ·  users with no clean success drop out</text>

  <!-- STATEMENTS (fan) -->
  <path class="flow" d="M360,348 C220,356 130,356 100,372" marker-end="url(#ag)"/>
  <path class="flow" d="M360,348 C300,356 290,358 273,372" marker-end="url(#ag)"/>
  <path class="flow" d="M360,348 C420,356 430,358 447,372" marker-end="url(#ag)"/>
  <path class="flow" d="M360,348 C500,356 590,356 620,372" marker-end="url(#ag)"/>

  <rect class="box" x="20"  y="374" width="160" height="72" rx="9"/>
  <text class="t" x="100" y="401" text-anchor="middle" font-size="13">Statement 0</text>
  <text class="s" x="100" y="419" text-anchor="middle">Impact</text>
  <text class="m" x="100" y="434" text-anchor="middle">before vs after</text>

  <rect class="box" x="193" y="374" width="160" height="72" rx="9"/>
  <text class="t" x="273" y="401" text-anchor="middle" font-size="13">Statement 1</text>
  <text class="s" x="273" y="419" text-anchor="middle">Per-check summary</text>
  <text class="m" x="273" y="434" text-anchor="middle">flagged · status</text>

  <rect class="box" x="366" y="374" width="160" height="72" rx="9"/>
  <text class="t" x="446" y="401" text-anchor="middle" font-size="13">Statement 2</text>
  <text class="s" x="446" y="419" text-anchor="middle">Self-check</text>
  <text class="m" x="446" y="434" text-anchor="middle">PASS / FAIL</text>

  <rect class="box" x="539" y="374" width="160" height="72" rx="9"/>
  <text class="t" x="619" y="401" text-anchor="middle" font-size="13">Statement 3</text>
  <text class="s" x="619" y="419" text-anchor="middle">Attribution</text>
  <text class="m" x="619" y="434" text-anchor="middle">which check, how much</text>

  <!-- rail to result -->
  <path class="flow" d="M100,446 L100,462 M273,446 L273,462 M446,446 L446,462 M619,446 L619,462" />
  <path class="flow" d="M100,462 L619,462" />
  <path class="flow" d="M360,462 L360,486" marker-end="url(#ag)"/>

  <!-- RESULT -->
  <rect class="box" x="160" y="488" width="400" height="74" rx="12"/>
  <text class="t" x="360" y="514" text-anchor="middle">Data-Quality Impact Report</text>
  <text class="s" x="360" y="533" text-anchor="middle">raw ~92% → true ~68% success (illustrative)</text>
  <text class="m" x="360" y="551" text-anchor="middle">self-validated · reproducible</text>

  <!-- legend + attribution -->
  <rect x="20" y="586" width="14" height="14" rx="3" fill="#1D9E75"/>
  <text class="m" x="40" y="597">green = safety guardrail (read-only, non-destructive)</text>
  <text class="m" x="700" y="597" text-anchor="end">Built at Hazel Mobile · illustrative, no real data</text>
</svg>
