<svg viewBox="0 30 960 700" xmlns="http://www.w3.org/2000/svg" font-family="'Google Sans',Roboto,system-ui,Arial,sans-serif">
<title>Hexa Query — Automated Data Analyst AI Agent, overall system architecture</title>
<desc>Two entry points feed two modes on a shared engine: curated SQL checks plus a generative text-to-SQL graph. The engine talks to three local services (Ollama, SearXNG in Docker, and a read-only DB tunnel). Everything runs on the laptop except the remote Hexa database, public search, and the cloud model that writes the SQL, which receives only the schema and the question.</desc>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a5f68"/></marker>
</defs>
<style>
.t{font-size:13.5px;font-weight:600;fill:#1a1c1e}
.s{font-size:10.5px;fill:#5a5f68}
.hdr{font-size:11px;font-weight:700;letter-spacing:.09em;fill:#5a5f68}
.ln{stroke:#5a5f68;stroke-width:1.5;fill:none;marker-end:url(#ar)}
.dash{stroke:#9aa0aa;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
</style>
<rect x="0" y="30" width="960" height="700" fill="#ffffff"/>

<!-- PRIVACY BOUNDARY: the laptop -->
<rect x="14" y="52" width="720" height="650" rx="20" fill="none" stroke="#0b57d0" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="28" y="44" class="hdr" fill="#0b57d0">YOUR LAPTOP — everything below runs locally &amp; privately</text>

<!-- ENTRY -->
<rect x="60" y="72" width="270" height="48" rx="11" fill="#d3e3fd" stroke="#0b57d0"/>
<text x="195" y="92" text-anchor="middle" class="t">app.py — &#8220;Hexa Query&#8221; UI</text>
<text x="195" y="108" text-anchor="middle" class="s">dark mode · chat history · Stop · charts</text>
<rect x="420" y="72" width="270" height="48" rx="11" fill="#d3e3fd" stroke="#0b57d0"/>
<text x="555" y="92" text-anchor="middle" class="t">run_pipeline.py — CLI</text>
<text x="555" y="108" text-anchor="middle" class="s">scheduled / one-shot (n8n)</text>

<!-- MODES -->
<text x="28" y="150" class="hdr">TWO MODES</text>
<rect x="60" y="158" width="290" height="62" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="205" y="180" text-anchor="middle" class="t">MODE 1 · Full Analysis</text>
<text x="205" y="197" text-anchor="middle" class="s">pipeline.py — autonomous</text>
<text x="205" y="211" text-anchor="middle" class="s">DQ -&gt; failures -&gt; fixes -&gt; verify -&gt; reports</text>
<rect x="400" y="158" width="290" height="62" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="545" y="180" text-anchor="middle" class="t">MODE 2 · Chat</text>
<text x="545" y="197" text-anchor="middle" class="s">chat_agent.py — intent router</text>
<text x="545" y="211" text-anchor="middle" class="s">database · web · conversation</text>

<!-- CORE ENGINE -->
<text x="28" y="250" class="hdr">SHARED ENGINE  (hexa_analyst package)</text>
<rect x="60" y="258" width="630" height="190" rx="14" fill="#eef2f8" stroke="#c4c7cf"/>

<text x="76" y="272" class="hdr" fill="#0f7b3f">TIER 1 · CURATED — trusted anchor numbers</text>
<rect x="76" y="280" width="140" height="46" rx="9" fill="#ffffff" stroke="#0f7b3f"/>
<text x="146" y="299" text-anchor="middle" class="t">dq_checks.py</text>
<text x="146" y="314" text-anchor="middle" class="s">YOUR DQ SQL</text>
<rect x="228" y="280" width="150" height="46" rx="9" fill="#ffffff" stroke="#0f7b3f"/>
<text x="303" y="299" text-anchor="middle" class="t">failure_checks.py</text>
<text x="303" y="314" text-anchor="middle" class="s">YOUR failure SQL</text>
<rect x="390" y="280" width="150" height="46" rx="9" fill="#ffffff" stroke="#0e9488" stroke-width="1.8"/>
<text x="465" y="299" text-anchor="middle" class="t">groundedness.py</text>
<text x="465" y="314" text-anchor="middle" class="s">grade fix vs sources</text>
<rect x="552" y="280" width="123" height="46" rx="9" fill="#ffffff" stroke="#c4c7cf"/>
<text x="613" y="299" text-anchor="middle" class="t">report.py</text>
<text x="613" y="314" text-anchor="middle" class="s">heatmap HTML</text>

<text x="76" y="350" class="hdr" fill="#8430ce">TIER 2 · GENERATIVE — leads to verify</text>
<rect x="76" y="358" width="140" height="46" rx="9" fill="#ffffff" stroke="#8430ce"/>
<text x="146" y="377" text-anchor="middle" class="t">sql_agent.py</text>
<text x="146" y="392" text-anchor="middle" class="s">LangGraph + self-repair</text>
<rect x="228" y="358" width="150" height="46" rx="9" fill="#ffffff" stroke="#8430ce"/>
<text x="303" y="377" text-anchor="middle" class="t">semantic.py</text>
<text x="303" y="392" text-anchor="middle" class="s">22 metric definitions</text>
<rect x="390" y="358" width="150" height="46" rx="9" fill="#ffffff" stroke="#b3261e" stroke-width="1.8"/>
<text x="465" y="377" text-anchor="middle" class="t">egress.py</text>
<text x="465" y="392" text-anchor="middle" class="s">the only way out</text>
<rect x="552" y="358" width="123" height="46" rx="9" fill="#ffffff" stroke="#c4c7cf"/>
<text x="613" y="377" text-anchor="middle" class="t">charts.py</text>
<text x="613" y="392" text-anchor="middle" class="s">auto visual + drill-down</text>

<rect x="76" y="414" width="599" height="20" rx="6" fill="#ffffff" stroke="#c4c7cf"/>
<text x="375" y="428" text-anchor="middle" class="s">db.py · guard.py (SELECT-only, v1.13.5) · scrub.py (Presidio) · providers.py (cloud-&gt;local failover) · config.py</text>

<!-- LOCAL SERVICES -->
<text x="28" y="482" class="hdr">LOCAL SERVICES  (on your machine)</text>
<rect x="60" y="490" width="200" height="70" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="160" y="512" text-anchor="middle" class="t">Ollama</text>
<text x="160" y="528" text-anchor="middle" class="s">qwen2.5 LLM + nomic embed</text>
<text x="160" y="543" text-anchor="middle" class="s">ALWAYS explains the results</text>
<rect x="285" y="490" width="200" height="70" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="385" y="512" text-anchor="middle" class="t">SearXNG</text>
<text x="385" y="528" text-anchor="middle" class="s">in Docker · :8080</text>
<text x="385" y="543" text-anchor="middle" class="s">self-hosted search</text>
<rect x="510" y="490" width="200" height="70" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="610" y="512" text-anchor="middle" class="t">SSH tunnel</text>
<text x="610" y="528" text-anchor="middle" class="s">localhost -&gt; read-only DB</text>
<text x="610" y="543" text-anchor="middle" class="s">SELECT-only DB user</text>

<!-- OUTPUTS -->
<text x="28" y="598" class="hdr">OUTPUTS</text>
<rect x="60" y="606" width="310" height="56" rx="12" fill="#c7f0d4" stroke="#0f7b3f"/>
<text x="215" y="628" text-anchor="middle" class="t">Two .html reports</text>
<text x="215" y="644" text-anchor="middle" class="s">Comparison + Action Plan · fixes flagged &#10003; / &#9888;</text>
<rect x="400" y="606" width="290" height="56" rx="12" fill="#c7f0d4" stroke="#0f7b3f"/>
<text x="545" y="628" text-anchor="middle" class="t">Chat answer + SQL + chart</text>
<text x="545" y="644" text-anchor="middle" class="s">number first · then why · hover &amp; drill down</text>

<!-- OUTSIDE THE BOUNDARY -->
<text x="770" y="44" class="hdr">OUTSIDE (leaves the laptop)</text>

<rect x="762" y="170" width="186" height="82" rx="12" fill="#ffffff" stroke="#8430ce"/>
<text x="855" y="192" text-anchor="middle" class="t">Groq cloud LLM</text>
<text x="855" y="208" text-anchor="middle" class="s">llama-3.3-70b</text>
<text x="855" y="223" text-anchor="middle" class="s">writes SQL only</text>
<text x="855" y="240" text-anchor="middle" class="s" fill="#b3261e">never sees a result row</text>

<rect x="762" y="373" width="186" height="66" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="855" y="395" text-anchor="middle" class="t">Public search</text>
<text x="855" y="411" text-anchor="middle" class="s">via SearXNG proxy</text>
<text x="855" y="426" text-anchor="middle" class="s">generic keywords only</text>

<rect x="762" y="490" width="186" height="70" rx="12" fill="#ffffff" stroke="#c4c7cf"/>
<text x="855" y="512" text-anchor="middle" class="t">Hexa Postgres</text>
<text x="855" y="528" text-anchor="middle" class="s">remote VPS (host redacted)</text>
<text x="855" y="543" text-anchor="middle" class="s">READ-ONLY · never written</text>

